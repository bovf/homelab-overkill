[project]
name = "ms-mcp-pubmed"
version = "0.1.0"
description = "PubMed (NCBI E-utilities) MCP server for the ms-researcher hermes-agent"
requires-python = ">=3.10"
dependencies = ["mcp", "httpx"]

[project.scripts]
ms-mcp-pubmed = "ms_mcp_pubmed.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
