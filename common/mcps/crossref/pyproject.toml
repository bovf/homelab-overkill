[project]
name = "ms-mcp-crossref"
version = "0.1.0"
description = "CrossRef DOI lookup MCP server for the ms-researcher hermes-agent"
requires-python = ">=3.10"
dependencies = ["mcp", "httpx"]

[project.scripts]
ms-mcp-crossref = "ms_mcp_crossref.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
