[project]
name = "koth-mcp-dice-roller"
version = "0.1.0"
description = "Dice expression MCP server for the koth-dm hermes-agent"
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.scripts]
koth-mcp-dice-roller = "koth_mcp_dice_roller.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
