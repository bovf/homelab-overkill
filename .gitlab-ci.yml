stages:
  - verify

verify:nix-cache-local:
  stage: verify
  tags:
    - nix-cache
  rules:
    - when: manual
  script:
    - set -euo pipefail
    - echo "DNS:"
    - curl -v https://cache.dobryops.com/badwater/nix-cache-info 2>&1 | grep -E 'IPv4:|Connected to cache\.dobryops\.com'
    - echo "Cache endpoint:"
    - curl -v https://cache.dobryops.com/badwater/nix-cache-info
    - echo "Nix config:"
    - nix config show | grep -E '^(substituters|trusted-public-keys) = '
    - echo "Try fetching a known runner tool from configured caches:"
    - nix build nixpkgs#attic-client --no-link -L --print-build-logs --option fallback false
    - echo "Force fetching a known runner tool from Attic only:"
    - nix build nixpkgs#attic-client --no-link -L --print-build-logs --option substituters "https://cache.dobryops.com/badwater" --option trusted-public-keys "badwater:GfR4TMrcaFJYnsldgBY+P27G620qwd9JRz831f6OxpU=" --option fallback false
    - echo "Store path:"
    - STORE_PATH="$(nix path-info nixpkgs#attic-client)"
    - echo "$STORE_PATH"
    - echo "Query cache narinfo directly:"
    - NARINFO="$(basename "$STORE_PATH" | cut -d- -f1).narinfo"
    - curl -fsS "https://cache.dobryops.com/badwater/$NARINFO" | head -40
